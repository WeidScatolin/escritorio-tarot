# Só o painel (somente leitura) sai para a internet. Webhooks, avisos e o resto ficam de fora.
server {
  listen 8080;
  location ~ ^/(painel|api/stats)/[^/]+$ {
    limit_except GET { deny all; }
    proxy_pass http://atendimento:3100;
    proxy_set_header Host $host;
  }
  location / { return 404; }
}
