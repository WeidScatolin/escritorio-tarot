services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on: [postgres, redis]
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped
    mem_limit: 1536m

  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped
    mem_limit: 1024m

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    mem_limit: 512m

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    mem_limit: 128m

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    depends_on: [postgres, redis]
    env_file: evolution.env
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - evolution_instances:/evolution/instances
    mem_limit: 768m

  atendimento:
    build: ../services/atendimento
    container_name: atendimento
    restart: unless-stopped
    depends_on: [evolution-api]
    env_file: atendimento.env
    environment:
      - PORT=3100
      - DB_PATH=/app/data/atendimento.db
      - EVOLUTION_URL=http://evolution-api:8080
    volumes:
      - atendimento_data:/app/data
    ports:
      - '127.0.0.1:3100:3100'
    mem_limit: 256m

  painel-proxy:
    image: nginx:alpine
    container_name: painel_proxy
    restart: unless-stopped
    depends_on: [atendimento]
    volumes:
      - ./painel-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 32m

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: painel_tunnel
    restart: unless-stopped
    depends_on: [painel-proxy]
    command: tunnel --no-autoupdate --url http://painel-proxy:8080
    mem_limit: 128m

volumes:
  storage_data:
  postgres_data:
  redis_data:
  evolution_instances:
  atendimento_data:
